server {
    listen 80;
    listen [::]:80;
    server_name amy-jaffe.157.90.162.50.nip.io amyjaffenutrition.com www.amyjaffenutrition.com;

    return 301 https://www.amyjaffenutrition.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name amyjaffenutrition.com;

    ssl_certificate /etc/letsencrypt/live/amyjaffenutrition.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amyjaffenutrition.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.amyjaffenutrition.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.amyjaffenutrition.com;

    ssl_certificate /etc/letsencrypt/live/amyjaffenutrition.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amyjaffenutrition.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/amy-jaffe-nutrition;
    index index.html;

    location = /analytics {
        return 301 /analytics/;
    }

    location = /analytics/api {
        auth_basic "Amy Jaffe Nutrition analytics";
        auth_basic_user_file /etc/nginx/.amy-jaffe-analytics.htpasswd;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /analytics/ {
        auth_basic "Amy Jaffe Nutrition analytics";
        auth_basic_user_file /etc/nginx/.amy-jaffe-analytics.htpasswd;
        try_files $uri $uri/ =404;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Preserve useful legacy Wix URLs during the domain cutover.
    location = /about { return 301 https://www.amyjaffenutrition.com/#about; }
    location = /treatments { return 301 https://www.amyjaffenutrition.com/#services; }
    location = /resources { return 301 https://www.amyjaffenutrition.com/#expertise; }
    location = /videos { return 301 https://www.amyjaffenutrition.com/#about; }
    location = /belly-video { return 301 https://www.amyjaffenutrition.com/#about; }
    location = /free-disordered-eating-consultation { return 301 https://www.amyjaffenutrition.com/free-introductory-call/; }
    location = /weight-issues-consultation { return 301 https://www.amyjaffenutrition.com/free-introductory-call/; }
    location ~ ^/blog(?:/categories/.*)?$ { return 301 https://www.amyjaffenutrition.com/; }
    location ~ ^/post/ { return 301 https://www.amyjaffenutrition.com/; }

    # Retired, non-business Wix utility pages should not remain indexed.
    location ~ ^/(?:2021gurzecatalog|lyrics[2-6]?)$ { return 410; }

    location ~* \.avif$ {
        default_type image/avif;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|avif|png|jpg|jpeg|svg|webp|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
